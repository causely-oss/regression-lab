  # -- Data stores ---------------------------------------------------------

payments-db:
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: payments
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
  ports:
    - "5432:5432"
  volumes:
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    - payments-db-data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
    interval: 5s
    timeout: 3s
    retries: 10

redis:
  image: redis:7-alpine
  ports:
    - "6379:6379"
  command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5

kafka:
  image: confluentinc/cp-kafka:7.6.0
  ports:
    - "9092:9092"
  environment:
    KAFKA_NODE_ID: 1
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  healthcheck:
    test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
    interval: 15s
    timeout: 10s
    retries: 10

  # -- Observability --------------------------------------------------------

prometheus:
  image: prom/prometheus:v2.51.0
  ports:
    - "9090:9090"
  volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
  command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.retention.time=1h"
  depends_on:
- analytics-service
- api-gateway
- audit-service
- auth-service
- billing-service
- cache-service
- cart-service
- catalog-service
- checkout
- delivery-service

grafana:
  image: grafana/grafana:10.4.0
  ports:
    - "3000:3000"
  environment:
    GF_SECURITY_ADMIN_PASSWORD: admin
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scenario-01.json
  volumes:
    - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    - ./grafana-dashboard.json:/var/lib/grafana/dashboards/scenario-01.json:ro
    - grafana-data:/var/lib/grafana
  depends_on:
    - prometheus

postgres-exporter:
  image: prometheuscommunity/postgres-exporter:v0.15.0
  environment:
    DATA_SOURCE_NAME: "postgresql://postgres:password@payments-db:5432/payments?sslmode=disable"
  ports:
    - "9187:9187"
  depends_on:
    payments-db:
      condition: service_healthy

redis-exporter:
  image: oliver006/redis_exporter:v1.58.0
  environment:
    REDIS_ADDR: redis://redis:6379
  ports:
    - "9121:9121"
  depends_on:
    - redis

volumes:
  payments-db-data:
  grafana-data: