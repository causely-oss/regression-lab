apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: scenario-01
  labels:
    service: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        service: analytics-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8107"
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z kafka 9092; do echo "waiting for kafka..."; sleep 2; done
      containers:
      - name: analytics-service
        image: docker.io/causely-oss/analytics-service:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8107
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_PROPAGATORS
          value: tracecontext,baggage
        - name: OTEL_SERVICE_NAME
          value: analytics-service
        - name: REPORTING_SERVICE_URL
          value: http://reporting-service:8110
        - name: CACHE_SERVICE_URL
          value: http://cache-service:8109
        - name: KAFKA_BROKERS
          value: kafka:9092
        readinessProbe:
          httpGet:
            path: /health
            port: 8107
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: scenario-01
  labels:
    service: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
  - port: 8107
    targetPort: 8107
---
