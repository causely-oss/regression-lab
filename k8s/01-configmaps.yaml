---
# ── Grafana dashboard ──────────────────────────────────────────────────────────
# Loaded into the shared Grafana in the monitoring namespace by its
# grafana-sc-dashboard sidecar, which watches ALL namespaces for ConfigMaps
# labeled grafana_dashboard=1. Uses the "Prometheus" datasource already
# provisioned there (pointed at kube-prometheus-stack-prometheus.monitoring).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: scenario-01
  labels:
    grafana_dashboard: "1"
data:
  scenario-01.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "\ud83c\udfe5 Platform Health",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 2,
          "title": "Checkout Success Rate",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{job=\"checkout\",status=~\"2..\"}[1m])) / sum(rate(http_requests_total{job=\"checkout\"}[1m]))",
              "legendFormat": "Checkout Success Rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Platform Error Rate",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{status=~\"5..\"}[1m])) / sum(rate(http_requests_total[1m]))",
              "legendFormat": "Platform Error Rate",
              "refId": "A"
